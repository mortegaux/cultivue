<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CultiVue</title>
  <link rel="stylesheet" href="/css/styles.css?v=5">
  <script defer src="/js/chart.min.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Screen reader announcer -->
  <div id="sr-announcer" role="status" aria-live="polite" class="sr-only"></div>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Auth screen (login/setup/change-password) -->
  <div class="auth-screen" id="authScreen" role="region" aria-label="Authentication" hidden></div>

  <div class="app-layout" id="appLayout" hidden>
    <!-- Sidebar (desktop) / Bottom nav (mobile) -->
    <nav class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <span class="material-symbols-outlined brand-icon" aria-hidden="true">eco</span>
        <span class="brand-text">CultiVue</span>
      </div>
      <ul class="nav-links" role="list">
        <li><button class="nav-link active" data-page="dashboard" type="button" aria-current="page"><span class="material-symbols-outlined" aria-hidden="true">dashboard</span><span>Dashboard</span></button></li>
        <li><button class="nav-link" data-page="gardens" type="button"><span class="material-symbols-outlined" aria-hidden="true">yard</span><span>Gardens</span></button></li>
        <li><button class="nav-link" data-page="locations" type="button"><span class="material-symbols-outlined" aria-hidden="true">location_on</span><span>Locations</span></button></li>
        <li><button class="nav-link" data-page="logs" type="button"><span class="material-symbols-outlined" aria-hidden="true">monitoring</span><span>Logs</span></button></li>
        <li><button class="nav-link" data-page="tasks" type="button"><span class="material-symbols-outlined" aria-hidden="true">checklist</span><span>Tasks</span></button></li>
        <li><button class="nav-link" data-page="plants" type="button"><span class="material-symbols-outlined" aria-hidden="true">potted_plant</span><span>Plants</span></button></li>
        <li><button class="nav-link" data-page="seeds" type="button"><span class="material-symbols-outlined" aria-hidden="true">grass</span><span>Seeds</span></button></li>
        <li><button class="nav-link" data-page="settings" type="button"><span class="material-symbols-outlined" aria-hidden="true">settings</span><span>Settings</span></button></li>
      </ul>
      <div class="sidebar-footer">
        <div id="userBadge"></div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="main-content" tabindex="-1">
      <!-- Pages are rendered here by JS -->
    </main>
  </div>

  <!-- Modal backdrop -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
  </div>

  <script src="/js/api.js?v=5"></script>
  <script src="/js/app.js?v=5"></script>
</body>
</html>
