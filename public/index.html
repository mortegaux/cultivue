<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CultiVue</title>
  <link rel="stylesheet" href="/css/styles.css?v=9">
  <script defer src="/js/chart.min.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Screen reader announcer -->
  <div id="sr-announcer" role="status" aria-live="polite" class="sr-only"></div>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Auth screen (login/setup/change-password) -->
  <div class="auth-screen" id="authScreen" role="region" aria-label="Authentication" hidden></div>

  <div class="app-layout" id="appLayout" hidden>
    <!-- Sidebar (desktop) / Bottom nav (mobile) -->
    <nav class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <span class="material-symbols-outlined brand-icon" aria-hidden="true">eco</span>
        <span class="brand-text">CultiVue</span>
      </div>
      <ul class="nav-links" role="list">
        <li class="nav-primary-item"><button class="nav-link active" data-page="dashboard" type="button" aria-current="page"><span class="material-symbols-outlined" aria-hidden="true">dashboard</span><span class="nav-label">Dashboard</span></button></li>
        <li class="nav-primary-item"><button class="nav-link" data-page="gardens" type="button"><span class="material-symbols-outlined" aria-hidden="true">yard</span><span class="nav-label">Gardens</span></button></li>
        <li class="nav-primary-item"><button class="nav-link" data-page="logs" type="button"><span class="material-symbols-outlined" aria-hidden="true">monitoring</span><span class="nav-label">Logs</span></button></li>
        <li class="nav-primary-item"><button class="nav-link" data-page="tasks" type="button"><span class="material-symbols-outlined" aria-hidden="true">checklist</span><span class="nav-label">Tasks</span></button></li>
        <li class="nav-more-item"><button class="nav-link" id="moreNavBtn" type="button"><span class="material-symbols-outlined" aria-hidden="true">more_horiz</span><span class="nav-label">More</span></button></li>
        <li class="nav-secondary-item"><button class="nav-link" data-page="calendar" type="button"><span class="material-symbols-outlined" aria-hidden="true">calendar_month</span><span class="nav-label">Calendar</span></button></li>
        <li class="nav-secondary-item"><button class="nav-link" data-page="plants" type="button"><span class="material-symbols-outlined" aria-hidden="true">potted_plant</span><span class="nav-label">Plants</span></button></li>
        <li class="nav-secondary-item"><button class="nav-link" data-page="seeds" type="button"><span class="material-symbols-outlined" aria-hidden="true">grain</span><span class="nav-label">Seeds</span></button></li>
        <li class="nav-secondary-item"><button class="nav-link" data-page="locations" type="button"><span class="material-symbols-outlined" aria-hidden="true">location_on</span><span class="nav-label">Locations</span></button></li>
        <li class="nav-secondary-item"><button class="nav-link" data-page="settings" type="button"><span class="material-symbols-outlined" aria-hidden="true">settings</span><span class="nav-label">Settings</span></button></li>
      </ul>
      <div class="sidebar-footer">
        <div id="userBadge"></div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="main-content" tabindex="-1">
      <!-- Pages are rendered here by JS -->
    </main>
  </div>

  <!-- Drawer (slide-out panel) -->
  <div class="drawer-backdrop" id="drawerBackdrop" hidden>
    <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></div>
  </div>

  <!-- More bottom sheet -->
  <div class="more-sheet-backdrop" id="moreSheetBackdrop" hidden>
    <div class="more-sheet" id="moreSheet" role="dialog" aria-modal="true" aria-label="More navigation"></div>
  </div>

  <!-- Modal backdrop -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
  </div>

  <script src="/js/api.js?v=7"></script>
  <script src="/js/app.js?v=8"></script>
</body>
</html>
