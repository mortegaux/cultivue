<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CultiVue</title>
  <link rel="stylesheet" href="/css/styles.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Screen reader announcer -->
  <div id="sr-announcer" role="status" aria-live="polite" class="sr-only"></div>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Auth screen (login/setup/change-password) -->
  <div class="auth-screen" id="authScreen" role="region" aria-label="Authentication" hidden></div>

  <div class="app-layout" id="appLayout" hidden>
    <!-- Sidebar (desktop) / Bottom nav (mobile) -->
    <nav class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span class="brand-text">CultiVue</span>
      </div>
      <ul class="nav-links" role="list">
        <li><button class="nav-link active" data-page="dashboard" type="button" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>Dashboard</span></button></li>
        <li><button class="nav-link" data-page="gardens" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Gardens</span></button></li>
        <li><button class="nav-link" data-page="locations" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg><span>Locations</span></button></li>
        <li><button class="nav-link" data-page="logs" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>Logs</span></button></li>
        <li><button class="nav-link" data-page="tasks" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg><span>Tasks</span></button></li>
        <li><button class="nav-link" data-page="plants" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 20h10"/><path d="M12 20v-6"/><path d="M12 14c-3.5 0-6-2.5-6-6 3.5 0 6 2.5 6 6z"/><path d="M12 14c3.5 0 6-2.5 6-6-3.5 0-6 2.5-6 6z"/></svg><span>Plants</span></button></li>
        <li><button class="nav-link" data-page="seeds" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22c-4-3-8-7-8-12a8 8 0 0116 0c0 5-4 9-8 12z"/><path d="M12 6v6"/><path d="M9 9h6"/></svg><span>Seeds</span></button></li>
        <li><button class="nav-link" data-page="settings" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><span>Settings</span></button></li>
      </ul>
      <div class="sidebar-footer">
        <div id="userBadge"></div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="main-content" tabindex="-1">
      <!-- Pages are rendered here by JS -->
    </main>
  </div>

  <!-- Modal backdrop -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
  </div>

  <script src="/js/api.js?v=3"></script>
  <script src="/js/app.js?v=3"></script>
</body>
</html>
